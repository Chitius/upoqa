[build-system]
requires = ["setuptools >= 61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "upoqa"
dynamic = ["version"]
keywords = ["derivation-free", "optimization", "DFO", "partially-separable"]
authors = [
    { name = "Yichuan Liu", email = "liuyichuan2020@outlook.com" },
    { name = "Yingzhou Li", email = "yingzhouli@fudan.edu.cn" }
]
description = "A model-based derivative-free optimizer for unconstrained partially-separable problems."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "collections",
]

[project.urls]
GiteeRepository = "https://gitee.com/YiChuanT/upoqa"

[tool.setuptools.packages.find]
where = ["."] 
include = ["upoqa"] 
exclude = [] 
namespaces = false 

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"

[project.optional-dependencies]
profile = [
    "numpy>=2.0.0",  
    "scipy>=1.11.0",
    "pandas>=2.2.2",
    "matplotlib",
    "IPython",
    "termcolor",
    "spsa",
    "pdfo",
    "nlopt",
    "cobyqa",
    "Py-BOBYQA",
    "qiskit",
    "qiskit-algorithms",
    "scikit-quant",
    "cma",
]

[tool.black]
line-length = 100
target-version = ['py38']
skip-string-normalization = true